apiVersion: apps/v1
kind: Deployment
metadata:
  name: multiagent-app
  namespace: {{ .Values.namespace }}
  labels:
    app: multiagent-app
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app: multiagent-app
  template:
    metadata:
      labels:
        app: multiagent-app
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres {{ .Values.postgres.port }}; do echo waiting for postgres; sleep 2; done
      containers:
        - name: app
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.app.port }}
          envFrom:
            - configMapRef:
                name: multiagent-config
          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: multiagent-secrets
                  key: GROQ_API_KEY
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: multiagent-secrets
                  key: POSTGRES_PASSWORD
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.app.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.app.port }}
            initialDelaySeconds: 0
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.app.port }}
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          volumeMounts:
            - name: app-logs
              mountPath: /app/logs
      volumes:
        - name: app-logs
          emptyDir: {}
